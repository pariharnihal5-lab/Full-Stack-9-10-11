<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <fieldset>
        <legend align ="center">Basic Form</legend>
        <form >
      <label for="fullName">Full Name :</label>
      <input
        type="text"
        name="Name"
        id="fullName"
        placeholder="Enter your full name ."
      />

      <br />
      <br />

      <label for="email">Email: </label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Enter  your Email"
      />
      <br />
      <br />
      <label for="password"> Password : </label>
      <input
        type="password"
        name="NewPassword"
        id="password"
        placeholder="Confirm your Password"
      />
      <br />
      <br />
      <label for="cfPassword">Confirm Password</label>
      <input
        type="password"
        name="cfPassword"
        value="cfPassword"
        placeholder="Confirm Your Password"
      />
      <br /><br />

      <label for="dob"> Date of Birth</label>
      <input type="date" name="date" id="dob" />
      <br />
      <br />
      <label for="tob">Time of Birth</label>
      <input type="time" name="tob" id="tob" />
      <br /><br />
      <label for="joiningtime">Joining Time</label>
      <input type="datetime-local" name="joiningtime" id="joiningtime" />
      <br><br>

      <label for="volume">Volume</label>
      <input type="range" name="volume" id="volume" min="0" max="10" value="3"/>

      <br><br>
      <label for="number"> Mobile Number</label>
      <input type="number" name="number" id="number" />
      <br><br>

      <label for="resume">Resume</label>
      <input type="file" name="resume" id="resume"/>
      <br><br>
      <label for="address">Address:</label>
      <textarea name="address" id="address"></textarea>
      <br><br>
      <label for="course">Course:</label>
      <select name="course" id="course">
        <option value="">--select Option--</option>
        <option value="btech">B.Tech</option>
        <option value="bba"> B.B.A.</option>
        <option value="mtech">M.Tech</option>
      </select>
      <br><br>
      <label for="gender">Gender:</label>
      <input type="radio" name="gender" id="Male" value="male"/>
      <span>Male</span>
      <input type="radio" name="gender" id="female" value="female"/>
      <span>Female</span>
      <input type="radio" name="gender" id="others" value="others"/>
      <span>Others</span>
      <br><br>
      <label for="skillset">Skillset:</label>
      <input type="checkbox" name="java" id="java" value="java"/>
      <span>Java</span>
      <input type="checkbox" name="dsa" id="dsa" value="dsa"/>
      <span>DSA</span>
      <input type="checkbox" name="oop" id="oop" value="oop"/>
      <span>OOP</span>
      <br><br>


      <br><br>
      <button>Submit</button>
    </form>

    </fieldset>
    <img src="./image.png" alt="" width="200px" height="100px">
    
  </body>
</html>
