<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Task 2:</h1>
    <fieldset>
      <form>
        <h1>Pizza Order Form</h1>
        <label for="firstname">First name: </label>
        <input type="firstname" name="firstname" id="firstname" />
        <br /><br />
        <label for="lastname">Last name: </label>
        <input type="lastname" name="lastname" id="lastname" />
        <br /><br />
        <label for="Emailaddress">Email Address: </label>
        <input type="email" name="Emailaddress" id="Emailaddress" />
        <br /><br />
        <label for="ContactNumber">Contact Number: </label>
        <input type="number" name="ContactNumber" id="ContactNumber" />
        <br /><br />
        <label for="PreferredDeliveryDate">Preferred Delivery Date: </label>
        <input
          type="date"
          name="PreferredDeliveryDate"
          id="PreferredDeliveryDate"
        />
        <br /><br />
        <label for="size">Size:</label>
        <br />
        <input type="radio" name="size" id="size" value="Small" />
        <span>Small</span>
        <input type="radio" name="size" id="size" value="Medium" />
        <span>Medium</span>
        <input type="radio" name="size" id="size" value="Large" />
        <span>Large</span>
        <br /><br />
        <label for="flavor">Flavor:</label>
        <br />
        <input
          type="checkbox"
          name="flavor"
          id="flavor"
          value="Hawaiian(Php150.00)"
        />
        <span>Hawaiian(Php150.00)</span>
        <input
          type="number"
          name="number"
          id="flavor"
          min="1"
          placeholder="1"
        />
        <br />
        <input
          type="checkbox"
          name="flavor"
          id="flavor"
          value="Pepperoni(Php140.00)"
        />
        <span>Pepperoni(Php140.00)</span>
        <input
          type="number"
          name="number"
          id="flavor"
          min="1"
          placeholder="1"
        />
        <br />
        <input
          type="checkbox"
          name="flavor"
          id="flavor"
          value="Vegetable(Php130.00)"
        />
        <span>Vegetable(Php130.00)</span>
        <input
          type="number"
          name="number"
          id="flavor"
          min="1"
          placeholder="1"
        />
        <br /><br />
        <label for="CreditCardNumber"> Credit Card Number:</label>
        <input
          type="CreditCardNumber"
          name="CreditCardNumber"
          id="CreditCardNumber"
        />
        <br /><br />
        <label for="Pin">Pin:</label>
        <input type="Pin" name="Pin" id="Pin" />
        <br /><br />
        br><br />
        <label for="additionnote">Additional Note :</label>
        <textarea name="additionnote" id="additionnote"></textarea>
        <br /><br />
        <button>Submit Order</button>
      </form>
    </fieldset>
</body>
</html>
