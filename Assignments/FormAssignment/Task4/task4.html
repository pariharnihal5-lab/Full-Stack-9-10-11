<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Task 4:</h1>
    <fieldset>
      <table border="1" cellpadding="8" cellspacing="2 ">
        <form>
          <tr>
            <th colspan="4">Registration Form</th>
          </tr>
          <tr>
            <td><label for="studentname">Student Name</label></td>
            <td>
              <input
                type="text"
                name="firstname"
                id="firstname"
                placeholder="First Name"
              />
            </td>
            <td>
              <input
                type="text"
                name="middlename"
                id="middlename"
                placeholder="Middle Name"
              />
            </td>
            <td>
              <input
                type="text"
                name="lastname"
                id="lastname"
                placeholder="LastName"
              />
            </td>
          </tr>
          <tr>
            <td><label for="fathername">Father's Name</label></td>
            <td>
              <input
                type="text"
                name="fathername"
                id="fathername"
                placeholder="Enter your father's Name"
              />
            </td>
            <td><label for="mothername">Mother's Name</label></td>
            <td>
              <input
                type="text"
                name="mothername"
                id="mothername"
                placeholder="Enter your mother's Name"
              />
            </td>
          </tr>
          <tr>
            <td><label for="dob"> Date of Birth</label></td>
            <td><input type="date" name="date" id="dob" /></td>
            <td><label for="gender">Gender:</label></td>
            <td>
              <input type="radio" name="gender" id="Male" value="male" />
              <span>Male</span>
              <input type="radio" name="gender" id="female" value="female" />
              <span>Female</span>
            </td>
          </tr>
          <tr>
            <td><label for="category">Category</label></td>
            <td>
              <span>Gen</span>
              <input type="radio" name="gen" id="gen" value="Gen" />
              <span>OBC</span>
              <input type="radio" name="obc" id="obc" value="obc" />
              <span>SC/ST</span>
              <input type="radio" name="scst" id="scst" value="scst" />
            </td>
            <td>
              <label for="handicapped">Handicapped</label>
            </td>
            <td>
              <span>Yes</span>
              <input type="radio" name="yes" id="yes" value="yes" />
              <span>No</span>
              <input type="radio" name="no" id="no" value="no" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="exserviceman">Ex-Serviceman</label>
            </td>
            <td>
              <span>Yes</span>
              <input type="radio" name="yes" id="yes" value="yes" />
              <span>No</span>
              <input type="radio" name="no" id="no" value="no" />
            </td>
            <td>
              <label for="ews">EWS</label>
            </td>
            <td>
              <span>Yes</span>
              <input type="radio" name="yes" id="yes" value="yes" />
              <span>No</span>
              <input type="radio" name="no" id="no" value="no" />
            </td>
          </tr>

          <tr>
            <td><label for="email">Email ID</label></td>
            <td>
              <input type="email" name="email" id="email" />
            </td>
            <td><label for="mobileno">Mobile No.</label></td>
            <td>
              <input type="number" name="mobileno" id="mobileno" />
            </td>
          </tr>
          <tr>
            <td><label for="state">State</label></td>
            <td>
              <select name="state" id="state">
                <option value="">Select any one</option>
              </select>
            </td>
            <td><label for="city">City</label></td>
            <td>
              <select name="city" id="city">
                <option value="">Select any one</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="uploadphoto">Upload Photo</label></td>
            <td><input type="file" name="uploadphoto" id="uploadphoto " /></td>
            <td><label for="uploadsign">Upload Signature</label></td>
            <td><input type="file" name="uploadphoto" id="uploadphoto " /></td>
          </tr>
          <tr>
            <td></td>
            <td colspan="3">
              <center><button>Submit</button></center>
            </td>
          </tr>
        </form>
        <tr></tr>
      </table>
    </fieldset>
</body>
</html>
